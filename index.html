<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIS:VS — LISA vs CAISH</title>
  <meta name="description" content="AI Safety Versus (AIS:VS) — LISA (London) vs CAISH (Cambridge). 3 hours. 2 hubs. 1 winner." />
  <meta name="theme-color" content="#0a0a0c" />

  <meta property="og:title" content="AIS:VS — LISA vs CAISH" />
  <meta property="og:description" content="3 Hours. 2 Hubs. 1 Winner." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== LIVE TICKER ===== -->
  <div class="ticker" id="ticker" aria-hidden="true">
    <div class="ticker__track" id="tickerTrack"></div>
  </div>

  <!-- ===== NAV (brand only) ===== -->
  <header class="nav">
    <div class="nav__inner">
      <a href="#top" class="brand" aria-label="AIS:VS home">
        <span class="brand__mark">AIS:VS</span>
        <span class="brand__sub">AI&nbsp;SAFETY&nbsp;VERSUS</span>
      </a>
    </div>
  </header>

  <main id="top">
    <!-- ===== HERO / VERSUS ===== -->
    <section class="hero">
      <div class="hero__grid-bg" aria-hidden="true"></div>

      <div class="hero__meta-top">
        <span class="tag tag--live"><span class="dot"></span>LIVE SEASON 01</span>
        <span class="tag">3 HOURS · 2 HUBS · 1 WINNER</span>
      </div>

      <div class="versus">
        <div class="versus__side versus__side--a">
          <span class="versus__label">LONDON HUB</span>
          <h1 class="versus__name">LISA</h1>
          <span class="versus__desc">London Initiative for Safe AI</span>
        </div>

        <div class="versus__vs" aria-hidden="true">
          <span class="versus__vstext">VS</span>
        </div>

        <div class="versus__side versus__side--b">
          <span class="versus__label">CAMBRIDGE HUB</span>
          <h1 class="versus__name">CAISH</h1>
          <span class="versus__desc">Cambridge AI Safety Hub</span>
        </div>
      </div>

      <!-- Countdown -->
      <div class="countdown" aria-label="Countdown to next round">
        <span class="countdown__label">NEXT ROUND STARTS IN</span>
        <div class="countdown__clock">
          <div class="cd"><span id="cd-d">00</span><small>DAYS</small></div>
          <span class="cd__sep">:</span>
          <div class="cd"><span id="cd-h">00</span><small>HRS</small></div>
          <span class="cd__sep">:</span>
          <div class="cd"><span id="cd-m">00</span><small>MIN</small></div>
          <span class="cd__sep">:</span>
          <div class="cd"><span id="cd-s">00</span><small>SEC</small></div>
        </div>
      </div>

      <!-- Meta cards -->
      <div class="metacards">
        <div class="metacard"><span class="metacard__k">FORMAT</span><span class="metacard__v">Bot Brawl</span></div>
        <div class="metacard"><span class="metacard__k">NEXT ROUND</span><span class="metacard__v">Sat · High-Noon</span></div>
        <div class="metacard"><span class="metacard__k">WHERE</span><span class="metacard__v">Your local hub</span></div>
        <div class="metacard"><span class="metacard__k">ENTRY</span><span class="metacard__v">Free</span></div>
      </div>
    </section>
  </main>

  <!-- ===== BACKGROUND AUDIO ===== -->
  <audio id="bgAudio" src="assets/the-final-banner.mp3" loop preload="auto"></audio>
  <button id="audioToggle" class="audio-toggle" type="button" aria-label="Pause background music" aria-pressed="true">
    <svg class="audio-toggle__icon audio-toggle__icon--pause" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="6" y="5" width="4" height="14" rx="1"></rect>
      <rect x="14" y="5" width="4" height="14" rx="1"></rect>
    </svg>
    <svg class="audio-toggle__icon audio-toggle__icon--play" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 5v14l11-7z"></path>
    </svg>
  </button>

  <script src="app.js"></script>
</body>
</html>
